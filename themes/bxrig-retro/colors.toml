lighter_background = "#3a2670"

foreground = "#f2e9ff"
dark_foreground = "#8a79b8"
light_foreground = "#d9c8ff"
bright_foreground = "#f2e9ff"

red = "#ff4d6d"
yellow = "#ffd23f"
orange = "#ff8a3d"
green = "#39ff9a"
cyan = "#19e6ff"
blue = "#6f7bff"
magenta = "#b44cff"
brown = "#7a3b5e"

bright_red = "#ff4d6d"
bright_yellow = "#ffd23f"
bright_green = "#39ff9a"
bright_cyan = "#19e6ff"
bright_blue = "#6f7bff"
bright_magenta = "#ff2ec4"
