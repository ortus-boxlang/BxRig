# BxRig Retro: 80s synthwave. Night-purple neutrals with neon magenta, cyan and mint.
mode = "dark"
# The font of the theme (an id of `bxrig appearance font list`): `theme set` uses it once it is installed (optional key, ignored by Omarchy).
font = "sharetech"

accent = "#ff2ec4"
selection = "#3a2670"
muted = "#8a79b8"

background = "#1a1033"
dark_background = "#120a26"
