# BxRig Clock: one bar widget, time as text (default "Nov 5 - 04:00"). Click opens the panel: local time, the zones you follow and a Calendar
# button. Right click opens the Noctalia calendar. The text follows the `format` setting (Noctalia date format tokens); `bxrig time format`
# writes it. The panel data comes from `bxrig time world --json`, polled every 30 s while the panel is open. Open the panel from a keybind with:
#   noctalia msg panel-toggle bxrig/clock:panel

id = "bxrig/clock"
name = "Clock (BxRig)"
version = "2.0.0"
plugin_api = 43
author = "bxrig"
license = "MIT"
dependencies = ["bxrig"]
tags = ["clock", "time", "bxrig"]
icon = "clock"
description = "The bar clock and world clock in one widget: time text, local time, zone offsets and a calendar shortcut."

# Plugin-level so the bar widget and the panel both see them.
[[setting]]
key = "command"
type = "string"
label_key = "settings.command.label"
description_key = "settings.command.description"
default = "bxrig"

[[setting]]
key = "format"
type = "string"
label_key = "settings.format.label"
description_key = "settings.format.description"
default = "%b %-d - %H:%M"

[[widget]]
id = "bar"
entry = "bar.luau"

  [widget.actions]
  right = "panel-toggle control-center calendar"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 380
height = "content"
max_height = 720
placement = "attached"
position = "auto"
open_near_click = true
